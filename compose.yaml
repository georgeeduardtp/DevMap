name: devmap

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DEVMAP_SCAN_ROOT: /workspace
    # Publish only the UI, on host loopback. The API stays private on 127.0.0.1:8080.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - project-data:/app/data
      - type: bind
        source: ${DEVMAP_REPOSITORIES:-.}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 12
    networks:
      - local

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # Share the backend's network namespace so the existing loopback-only API stays intact.
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    environment:
      DEVMAP_BACKEND_URL: http://127.0.0.1:8080
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 12

networks:
  local:
    driver: bridge

volumes:
  project-data:
